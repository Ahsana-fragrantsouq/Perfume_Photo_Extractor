<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FS Extractor</title>

  <!-- PWA: app name, icon, full-screen launch -->
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FS Extractor">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --black: #000;
      --panel: #1c1a17;
      --field: #2a2723;
      --line: #3d3934;
      --text: #f3efe8;
      --muted: #a39d93;
      --gold: #c9a45c;
      --gold-press: #b38f4a;
      --red: #e0806f;
      --green: #8fc79a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--black);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }

    /* ---------- Window 1: camera ---------- */
    #w1 { background: var(--black); }
    .viewfinder { position: relative; flex: 1; overflow: hidden; }
    .viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cam-msg {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      padding: 32px; text-align: center; color: var(--muted); line-height: 1.5;
    }
    .cam-msg button { color: var(--gold); text-decoration: underline; }

    .shutter-row { display: flex; justify-content: center; padding: 14px 0 12px; }
    .shutter {
      width: 72px; height: 72px; border-radius: 50%;
      border: 4px solid var(--text); padding: 5px;
    }
    .shutter span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--text); transition: transform .1s; }
    .shutter:active span { transform: scale(.88); }
    .shutter:disabled { opacity: .35; }

    .bar {
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 8px calc(12px + env(safe-area-inset-bottom, 0px));
      background: var(--panel);
    }
    .bar button {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      min-width: 72px; padding: 6px; font-size: 12px; color: var(--text);
    }
    .bar svg { width: 24px; height: 24px; }

    /* ---------- Window 2: shop name + extract ---------- */
    #w2 {
      background: var(--panel);
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
      gap: 16px;
    }
    .back { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 15px; padding: 6px 0; align-self: flex-start; }
    .back svg { width: 20px; height: 20px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; height: 48px; padding: 0 14px;
      background: var(--field); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; font-size: 16px;
    }
    .preview { flex: 1; min-height: 0; border-radius: 12px; background: var(--black); overflow: hidden; }
    .preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .msg { font-size: 14px; line-height: 1.5; min-height: 1.5em; }
    .msg.error { color: var(--red); }
    .msg.ok { color: var(--green); }
    .primary {
      height: 54px; border-radius: 12px; background: var(--gold); color: #1c1a17;
      font-size: 17px; font-weight: 600;
    }
    .primary:active { background: var(--gold-press); }
    .primary:disabled { opacity: .5; }

    /* ---------- Window 3: extracted items review ---------- */
    #w3 { background: var(--panel); }
    .w3-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px;
    }
    .w3-head h1 { font-size: 17px; font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .w3-head .count { color: var(--muted); font-weight: 400; }
    .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--field); flex-shrink: 0; }
    .icon-btn svg { width: 22px; height: 22px; }
    .list { flex: 1; overflow-y: auto; padding: 4px 16px 16px; -webkit-overflow-scrolling: touch; }
    .empty { color: var(--muted); text-align: center; padding: 48px 16px; line-height: 1.6; }

    .item { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; background: #221f1b; }
    .item.low { border-color: #6b3a31; }
    .item.saved { border-color: #3f5c45; }
    .item-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px; }
    .tick { width: 26px; height: 26px; flex-shrink: 0; accent-color: var(--gold); margin: 1px 0 0; }
    .item-main { flex: 1; min-width: 0; text-align: left; padding: 0; }
    .item-title { font-size: 15px; font-weight: 600; line-height: 1.35; }
    .item-sub { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .item-tags { display: flex; gap: 10px; margin-top: 6px; font-size: 12px; }
    .conf-high { color: var(--green); }
    .conf-medium { color: #d9b56b; }
    .conf-low { color: var(--red); }
    .tag-saved { color: var(--green); }
    .tag-edited { color: #d9b56b; }

    .editor { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 14px 50px; }
    .editor .full { grid-column: 1 / -1; }
    .editor label { margin-bottom: 4px; font-size: 12px; }
    .editor input { height: 42px; font-size: 15px; }
    .editor input.changed { border-color: var(--gold); }

    .w3-foot {
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line); background: var(--panel);
      display: flex; flex-direction: column; gap: 10px;
    }
    .foot-row { display: flex; gap: 10px; }
    .ghost { flex: 1; height: 42px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
    .w3-foot .msg { min-height: 0; }

    /* ---------- Busy overlay while extracting ---------- */
    #busy {
      position: fixed; inset: 0; background: rgba(0,0,0,.78);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      text-align: center; padding: 32px; z-index: 10;
    }
    .spinner { width: 44px; height: 44px; border: 3px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #busy p { margin: 0; color: var(--muted); line-height: 1.5; }
    #busy strong { color: var(--text); font-weight: 600; display: block; font-size: 17px; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  </style>
</head>
<body>

  <!-- ===================== WINDOW 1: CAMERA ===================== -->
  <section id="w1" class="screen" aria-label="Camera">
    <div class="viewfinder">
      <video id="video" playsinline muted autoplay></video>
      <div id="camMsg" class="cam-msg">Starting camera…</div>
    </div>

    <div class="shutter-row">
      <button id="shutterBtn" class="shutter" aria-label="Take photo" disabled><span></span></button>
    </div>

    <nav class="bar">
      <button id="galleryBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
        Gallery
      </button>
      <button type="button" onclick="goTo('/search')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        Search
      </button>
      <button type="button" onclick="goTo('/m/data')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        Saved
      </button>
    </nav>

    <!-- Hidden file picker used by the Gallery button (gallery + files/documents) -->
    <input id="fileInput" type="file" accept="image/*" hidden>
  </section>

  <!-- ===================== WINDOW 2: SHOP NAME + EXTRACT ===================== -->
  <section id="w2" class="screen" aria-label="Shop name and photo" hidden>
    <button id="retakeBtn" class="back" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Retake
    </button>

    <div>
      <label for="shopInput">Shop name</label>
      <input id="shopInput" type="text" list="shopList" placeholder="Pick a shop or type a new one" autocomplete="off">
      <datalist id="shopList"></datalist>
    </div>

    <div class="preview"><img id="previewImg" alt="Photo to extract from"></div>

    <div id="w2Msg" class="msg" role="status"></div>

    <button id="extractBtn" class="primary" type="button">Extract items</button>
  </section>

  <!-- ===================== WINDOW 3: EXTRACTED ITEMS ===================== -->
  <section id="w3" class="screen" aria-label="Extracted items" hidden>
    <header class="w3-head">
      <h1 id="w3Title">Items</h1>
      <button id="nextPhotoBtn" class="icon-btn" type="button" aria-label="Take next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
    </header>

    <div id="itemList" class="list"></div>

    <footer class="w3-foot">
      <div id="w3Msg" class="msg" role="status"></div>
      <div class="foot-row">
        <button id="selectAllBtn" class="ghost" type="button">Select all</button>
        <button id="deselectAllBtn" class="ghost" type="button">Deselect all</button>
      </div>
      <button id="saveBtn" class="primary" type="button" disabled>Save selected</button>
    </footer>
  </section>

  <!-- Suggestions for the edit boxes (filled from /api/field-options) -->
  <datalist id="concentrationOptions"></datalist>
  <datalist id="genderOptions"></datalist>
  <datalist id="conditionOptions"></datalist>

  <!-- Busy overlay shown while Claude reads the photo -->
  <div id="busy" hidden role="alert" aria-live="assertive">
    <div class="spinner"></div>
    <p><strong>Extracting items…</strong>This can take up to a minute for a full shelf. Keep the app open.</p>
  </div>

<script>
/* =================================================================
   FS Extractor — phone app (windows 1-3: camera, shop name, review)
   Every log line starts with a tag so you can filter the console:
     [m]       general / screen changes
     [camera]  live camera
     [photo]   taking / picking / shrinking photos
     [shops]   shop name list
     [extract] sending the photo to /extract
     [review]  window 3: ticking, editing, saving items via /record
     [PWA]     service worker / install
   ================================================================= */

const MAX_SIDE = 1568;      // same limit the server uses; Claude reads this size best
const JPEG_QUALITY = 0.85;
const LOGIN_URL = '/login?next=/m/';

const $ = (id) => document.getElementById(id);
const log = (tag, ...a) => console.log(`[${tag}]`, ...a);
const warn = (tag, ...a) => console.warn(`[${tag}]`, ...a);

let stream = null;          // live camera stream
let photoBlob = null;       // the photo waiting to be extracted
let previewUrl = null;      // temporary URL for the preview image
let wakeLock = null;        // keeps the screen on while extracting

/* ------------------------- Screens ------------------------- */

function showW1() {
  log('m', 'Show window 1 (camera)');
  $('w2').hidden = true;
  $('w1').hidden = false;
  startCamera();
}

function showW2(blob, source) {
  log('m', `Show window 2 (shop name) | photo from ${source} | ${(blob.size / 1024).toFixed(0)} KB`);
  photoBlob = blob;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(blob);
  $('previewImg').src = previewUrl;
  setMsg('');
  $('extractBtn').disabled = false;
  stopCamera();                       // save battery while on window 2
  $('w1').hidden = true;
  $('w2').hidden = false;
  history.pushState({ screen: 'w2' }, '');   // phone Back button returns to camera
  loadShops();
}

// Phone Back button on window 2 or 3 -> go back to camera instead of closing the app
window.addEventListener('popstate', () => {
  if (!$('w3').hidden) {
    const unsaved = countNeedsSaving();
    if (unsaved > 0 && !confirm(`${unsaved} ticked item(s) are not saved yet. Leave without saving?`)) {
      log('review', `Stayed on review screen (${unsaved} unsaved)`);
      history.pushState({ screen: 'w3' }, '');   // undo the Back
      return;
    }
    log('m', `Leaving review screen -> camera (${unsaved} unsaved left behind)`);
    $('w3').hidden = true;
    showW1();
    return;
  }
  if (!$('w2').hidden) { log('m', 'Back button pressed -> camera'); showW1(); }
});

function goTo(url) {
  log('m', `Opening ${url}`);
  stopCamera();
  location.href = url;
}

function setMsg(text, type) {
  const el = $('w2Msg');
  el.textContent = text;
  el.className = 'msg' + (type ? ' ' + type : '');
}

/* ------------------------- Camera ------------------------- */

async function startCamera() {
  if (stream) { log('camera', 'Already running'); return; }
  const msg = $('camMsg');
  msg.hidden = false;
  msg.textContent = 'Starting camera…';
  $('shutterBtn').disabled = true;

  if (!navigator.mediaDevices?.getUserMedia) {
    warn('camera', 'This browser has no camera access');
    msg.innerHTML = 'This browser can’t open the camera.<br>Use <button type="button" onclick="$(\'fileInput\').click()">Gallery</button> instead.';
    return;
  }

  try {
    log('camera', 'Requesting back camera…');
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
    const video = $('video');
    video.srcObject = stream;
    await video.play();
    const s = stream.getVideoTracks()[0].getSettings();
    log('camera', `Running | ${s.width}x${s.height} | facing: ${s.facingMode || 'unknown'}`);
    msg.hidden = true;
    $('shutterBtn').disabled = false;
  } catch (err) {
    warn('camera', 'Could not start:', err.name, err.message);
    stream = null;
    const denied = err.name === 'NotAllowedError';
    msg.innerHTML = denied
      ? 'Camera permission is off.<br>Allow camera access for this app in your phone settings, or use <button type="button" onclick="$(\'fileInput\').click()">Gallery</button>.'
      : 'Camera couldn’t start.<br><button type="button" onclick="startCamera()">Try again</button> or use <button type="button" onclick="$(\'fileInput\').click()">Gallery</button>.';
  }
}

function stopCamera() {
  if (!stream) return;
  stream.getTracks().forEach((t) => t.stop());
  stream = null;
  $('video').srcObject = null;
  log('camera', 'Stopped');
}

// Stop the camera when the app goes to the background, restart when it comes back
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    log('camera', 'App hidden -> stopping camera');
    stopCamera();
  } else if (!$('w1').hidden) {
    log('camera', 'App visible again -> restarting camera');
    startCamera();
  }
});

/* ------------------------- Taking / picking photos ------------------------- */

// Shrink a picture so its longest side is at most MAX_SIDE, then save as JPEG
function canvasToJpeg(source, w, h) {
  const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
  const cw = Math.round(w * scale), ch = Math.round(h * scale);
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  canvas.getContext('2d').drawImage(source, 0, 0, cw, ch);
  log('photo', `Resized ${w}x${h} -> ${cw}x${ch}`);
  return new Promise((resolve, reject) =>
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/jpeg', JPEG_QUALITY));
}

$('shutterBtn').addEventListener('click', async () => {
  const video = $('video');
  if (!video.videoWidth) { warn('photo', 'Camera not ready yet'); return; }
  log('photo', 'Shutter pressed');
  try {
    const blob = await canvasToJpeg(video, video.videoWidth, video.videoHeight);
    showW2(blob, 'camera');
  } catch (err) {
    warn('photo', 'Capture failed:', err);
  }
});

$('galleryBtn').addEventListener('click', () => {
  log('photo', 'Opening gallery / files');
  $('fileInput').click();
});

$('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';                 // lets the same photo be picked again later
  if (!file) { log('photo', 'Gallery closed without picking'); return; }
  log('photo', `Picked "${file.name}" | ${file.type || 'unknown type'} | ${(file.size / 1024).toFixed(0)} KB`);

  try {
    // Decode in the browser (keeps correct rotation), then shrink
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const blob = await canvasToJpeg(bmp, bmp.width, bmp.height);
    bmp.close();
    showW2(blob, 'gallery');
  } catch (err) {
    // Some formats (e.g. HEIC on Android) can't be decoded by the browser.
    // Send the original file instead — the server can read HEIC.
    warn('photo', 'Browser could not decode this file, sending original to server:', err.message);
    showW2(file, 'gallery (original)');
  }
});

/* ------------------------- Shop names ------------------------- */

async function loadShops() {
  const input = $('shopInput');
  if (!input.value) {
    try { input.value = localStorage.getItem('lastShop') || ''; } catch (_) {}
    if (input.value) log('shops', `Pre-filled last used shop: "${input.value}"`);
  }
  try {
    const res = await fetch('/api/shop-names');
    if (res.status === 401) return goToLogin('shops');
    const data = await res.json();
    const list = $('shopList');
    list.innerHTML = '';
    (data.shop_names || []).forEach((n) => {
      const o = document.createElement('option');
      o.value = n;
      list.appendChild(o);
    });
    log('shops', `Loaded ${(data.shop_names || []).length} shop name(s)`);
  } catch (err) {
    warn('shops', 'Could not load shop names (typing still works):', err.message);
  }
}

/* ------------------------- Extract ------------------------- */

$('retakeBtn').addEventListener('click', () => {
  log('m', 'Retake pressed');
  history.back();                      // triggers popstate -> showW1()
});

$('extractBtn').addEventListener('click', async () => {
  const shop = $('shopInput').value.trim();
  if (!shop) { setMsg('Enter a shop name first.', 'error'); $('shopInput').focus(); return; }
  if (!photoBlob) { setMsg('No photo yet. Tap Retake.', 'error'); return; }
  if (!navigator.onLine) { setMsg('No internet connection. Connect and tap Extract items again.', 'error'); return; }

  try { localStorage.setItem('lastShop', shop); } catch (_) {}

  const form = new FormData();
  form.append('photo', photoBlob, 'photo.jpg');   // server needs a .jpg name
  form.append('shop_name', shop);

  log('extract', `Sending photo to /extract | shop "${shop}" | ${(photoBlob.size / 1024).toFixed(0)} KB`);
  setBusy(true);
  const started = Date.now();

  try {
    const res = await fetch('/extract', { method: 'POST', body: form });
    const secs = ((Date.now() - started) / 1000).toFixed(1);
    if (res.status === 401) return goToLogin('extract');

    let data;
    try { data = await res.json(); }
    catch (_) { throw new Error(`Server returned status ${res.status} (not JSON) after ${secs}s. It may have timed out.`); }

    if (!res.ok) {
      warn('extract', `Failed | status ${res.status} | ${secs}s |`, data);
      setMsg(data.error || `Extraction failed (status ${res.status}).`, 'error');
      return;
    }

    log('extract', `Done in ${secs}s | ${data.item_count} item(s) | photo: ${data.image_url}`);
    console.table(data.items);

    // Keep a copy on the phone in case it's needed later (e.g. offline queue)
    try { sessionStorage.setItem('lastExtract', JSON.stringify(data)); } catch (_) {}

    showW3(data);
  } catch (err) {
    warn('extract', 'Error:', err.message);
    setMsg(err.message.includes('Failed to fetch')
      ? 'Connection lost while extracting. Check your internet and tap Extract items again.'
      : err.message, 'error');
  } finally {
    setBusy(false);
  }
});

function setBusy(on) {
  $('busy').hidden = !on;
  $('extractBtn').disabled = on;
  $('retakeBtn').disabled = on;
  on ? keepScreenOn() : releaseScreen();
}

// Stop the phone screen locking mid-extraction (which would cancel the upload)
async function keepScreenOn() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      log('extract', 'Screen kept awake');
    } else {
      log('extract', 'Wake lock not supported on this phone');
    }
  } catch (err) { warn('extract', 'Wake lock failed:', err.message); }
}
function releaseScreen() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; log('extract', 'Screen lock released'); }
}

function goToLogin(tag) {
  warn(tag, 'Not logged in -> going to login page');
  location.href = LOGIN_URL;
}

/* ------------------------- Window 3: review extracted items -------------------------
   Works exactly like the laptop results table:
   - each item keeps Claude's ORIGINAL values (never changed) + your CORRECTED values
   - Save sends only ticked items that are new, or edited since their last save
     -> /record logs corrections and saves to Master, same as the laptop
   Difference for the phone: cards instead of a table. Like the laptop,
   every item starts unticked - you tick the ones you want to save.
   Low-confidence items get a red border so you check them first.
------------------------------------------------------------------------------------- */

const FIELDS = ['brand', 'name', 'size', 'concentration', 'gender', 'condition'];
const FIELD_LABELS = { brand: 'Brand', name: 'Name', size: 'Size', concentration: 'Concentration', gender: 'Gender', condition: 'Condition' };
const AUTOCOMPLETE_FIELDS = ['concentration', 'gender', 'condition'];

let review = null;   // { shopName, imageUrl, original: [...], current: [...], ticked: [...], saved: {index: snapshot} }

// Load Concentration / Gender / Condition suggestions once
(async function loadFieldOptions() {
  try {
    const res = await fetch('/api/field-options');
    if (!res.ok) { warn('review', `Field options not loaded (status ${res.status})`); return; }
    const opts = await res.json();
    AUTOCOMPLETE_FIELDS.forEach((f) => {
      $(`${f}Options`).innerHTML = (opts[f] || []).map((v) => `<option value="${esc(v)}"></option>`).join('');
    });
    log('review', 'Field suggestions loaded:', AUTOCOMPLETE_FIELDS.map((f) => `${f} ${(opts[f] || []).length}`).join(', '));
  } catch (err) { warn('review', 'Field suggestions failed (typing still works):', err.message); }
})();

function showW3(data) {
  const items = data.items || [];
  review = {
    shopName: data.shop_name,
    imageUrl: data.image_url ?? null,
    original: items,                                        // exactly what Claude returned
    current: items.map((it) => {                            // what you see / edit
      const c = {}; FIELDS.forEach((f) => { c[f] = it[f] ?? ''; }); return c;
    }),
    ticked: items.map(() => false),                         // all unticked at start
    saved: {},
  };
  const low = items.filter((it) => (it.confidence || '').toLowerCase() === 'low').length;
  log('review', `Show window 3 | ${items.length} item(s) | all unticked | ${low} low-confidence`);

  $('w3Title').innerHTML = `${esc(review.shopName)} <span class="count">· ${items.length} item${items.length === 1 ? '' : 's'}</span>`;
  setW3Msg('');
  renderItems();

  $('w2').hidden = true;
  $('w3').hidden = false;
  history.replaceState({ screen: 'w3' }, '');   // Back from here goes to camera
}

function renderItems() {
  const list = $('itemList');
  if (!review.original.length) {
    list.innerHTML = '<div class="empty">No items were found in this photo.<br>Try a closer, sharper photo of the shelf.</div>';
    refreshSaveButton();
    return;
  }
  list.innerHTML = review.original.map((orig, i) => {
    const conf = (orig.confidence || '').toLowerCase();
    return `
      <div class="item${conf === 'low' ? ' low' : ''}" id="item-${i}">
        <div class="item-row">
          <input type="checkbox" class="tick" data-i="${i}" ${review.ticked[i] ? 'checked' : ''} aria-label="Select item ${i + 1}">
          <button type="button" class="item-main" data-i="${i}" aria-expanded="false">
            <div class="item-title" id="title-${i}"></div>
            <div class="item-sub" id="sub-${i}"></div>
            <div class="item-tags">
              <span class="conf-${esc(conf)}">${conf ? esc(conf) + (conf === 'low' ? ' · check this' : '') : 'no confidence'}</span>
              <span id="state-${i}"></span>
            </div>
          </button>
        </div>
        <div class="editor" id="editor-${i}" hidden>
          ${FIELDS.map((f) => `
            <div class="${f === 'name' ? 'full' : ''}">
              <label for="f-${i}-${f}">${FIELD_LABELS[f]}</label>
              <input type="text" id="f-${i}-${f}" data-i="${i}" data-f="${f}" value="${esc(review.current[i][f])}"
                     autocomplete="off"${AUTOCOMPLETE_FIELDS.includes(f) ? ` list="${f}Options"` : ''}>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('');
  review.original.forEach((_, i) => updateCard(i));
  refreshSaveButton();
}

// Refresh the summary text and Saved / Edited tags of one card
function updateCard(i) {
  const c = review.current[i];
  $(`title-${i}`).textContent = [c.brand, c.name].filter(Boolean).join(' · ') || 'Unnamed item';
  $(`sub-${i}`).textContent = [c.size, c.concentration, c.gender, c.condition].filter(Boolean).join(' · ') || 'No details';

  const saved = review.saved[i];
  const edited = FIELDS.some((f) => (c[f] || '') !== (review.original[i][f] ?? ''));
  const card = $(`item-${i}`), state = $(`state-${i}`);
  if (saved && !differsFromSaved(i)) {
    card.classList.add('saved'); state.className = 'tag-saved'; state.textContent = '✓ Saved';
  } else if (saved) {
    card.classList.remove('saved'); state.className = 'tag-edited'; state.textContent = 'Edited · save again';
  } else {
    card.classList.remove('saved'); state.className = edited ? 'tag-edited' : ''; state.textContent = edited ? 'Edited' : '';
  }
}

// Values as /record expects them: trimmed, empty -> null (same as the laptop page)
function corrected(i) {
  const out = {};
  FIELDS.forEach((f) => { out[f] = (review.current[i][f] || '').trim() || null; });
  return out;
}
function differsFromSaved(i) {
  return JSON.stringify(corrected(i)) !== JSON.stringify(review.saved[i]);
}
// Ticked AND (never saved OR edited since last save) — avoids saving duplicates
function needsSaving(i) {
  return review.ticked[i] && (!review.saved[i] || differsFromSaved(i));
}
function countNeedsSaving() {
  return review ? review.original.filter((_, i) => needsSaving(i)).length : 0;
}

function refreshSaveButton() {
  const n = countNeedsSaving();
  $('saveBtn').disabled = n === 0;
  $('saveBtn').textContent = n ? `Save selected (${n})` : 'Save selected';
}

function setW3Msg(text, type) {
  const el = $('w3Msg');
  el.textContent = text;
  el.className = 'msg' + (type ? ' ' + type : '');
}

// Tick / untick
$('itemList').addEventListener('change', (e) => {
  if (!e.target.classList.contains('tick')) return;
  const i = +e.target.dataset.i;
  review.ticked[i] = e.target.checked;
  log('review', `Item ${i + 1} ${e.target.checked ? 'ticked' : 'unticked'}`);
  refreshSaveButton();
});

// Tap a card -> open / close its edit boxes
$('itemList').addEventListener('click', (e) => {
  const btn = e.target.closest('.item-main');
  if (!btn) return;
  const i = +btn.dataset.i;
  const ed = $(`editor-${i}`);
  ed.hidden = !ed.hidden;
  btn.setAttribute('aria-expanded', String(!ed.hidden));
  log('review', `Item ${i + 1} editor ${ed.hidden ? 'closed' : 'opened'}`);
});

// Typing in an edit box
$('itemList').addEventListener('input', (e) => {
  const inp = e.target;
  if (!inp.dataset.f) return;
  const i = +inp.dataset.i, f = inp.dataset.f;
  review.current[i][f] = inp.value;
  inp.classList.toggle('changed', inp.value !== (review.original[i][f] ?? ''));
  updateCard(i);
  refreshSaveButton();
});
$('itemList').addEventListener('focusout', (e) => {
  const inp = e.target;
  if (inp.dataset && inp.dataset.f) {
    const i = +inp.dataset.i, f = inp.dataset.f;
    if (inp.value !== (review.original[i][f] ?? '')) {
      log('review', `Item ${i + 1} ${f}: "${review.original[i][f] ?? ''}" -> "${inp.value}"`);
    }
  }
});

$('selectAllBtn').addEventListener('click', () => {
  review.ticked = review.ticked.map(() => true);
  document.querySelectorAll('.tick').forEach((cb) => { cb.checked = true; });
  log('review', 'Select all');
  refreshSaveButton();
});
$('deselectAllBtn').addEventListener('click', () => {
  review.ticked = review.ticked.map(() => false);
  document.querySelectorAll('.tick').forEach((cb) => { cb.checked = false; });
  log('review', 'Deselect all');
  refreshSaveButton();
});

// Camera icon -> next photo (Back handler warns about unsaved items)
$('nextPhotoBtn').addEventListener('click', () => {
  log('review', 'Next photo pressed');
  history.back();
});

// Save -> /record (same request format as the laptop page)
$('saveBtn').addEventListener('click', async () => {
  const indexes = review.original.map((_, i) => i).filter(needsSaving);
  if (!indexes.length) { setW3Msg('Nothing new to save.'); return; }
  if (!navigator.onLine) { setW3Msg('No internet connection. Connect and tap Save again.', 'error'); return; }

  const items = indexes.map((i) => ({ original: review.original[i], corrected: corrected(i), selected: true }));
  log('review', `Saving ${items.length} item(s) to /record | shop "${review.shopName}"`, items);

  $('saveBtn').disabled = true;
  $('saveBtn').textContent = 'Saving…';
  setW3Msg('');

  try {
    const res = await fetch('/record', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shop_name: review.shopName, image_url: review.imageUrl, items }),
    });
    if (res.status === 401) return goToLogin('review');
    const data = await res.json();

    if (!res.ok) {
      warn('review', `Save failed | status ${res.status} |`, data);
      setW3Msg(data.error || `Save failed (status ${res.status}).`, 'error');
      return;
    }

    indexes.forEach((i) => { review.saved[i] = corrected(i); updateCard(i); });
    log('review', `Saved ${data.items_saved} item(s) | ${data.corrections_logged} correction(s) logged`);
    setW3Msg(`Saved ${data.items_saved} item(s). ${data.corrections_logged} correction(s) logged.`, 'ok');
  } catch (err) {
    warn('review', 'Save error:', err.message);
    setW3Msg('Connection lost while saving. Check your internet and tap Save again.', 'error');
  } finally {
    refreshSaveButton();
  }
});

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ------------------------- Service worker (install support) ------------------------- */

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then((reg) => log('PWA', 'Service worker registered | scope:', reg.scope))
    .catch((err) => warn('PWA', 'Service worker registration FAILED:', err));
} else {
  warn('PWA', 'Service workers not supported in this browser');
}
log('PWA', 'Running as installed app:',
  window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true);
window.addEventListener('appinstalled', () => log('PWA', 'App installed'));

/* ------------------------- Start ------------------------- */
log('m', 'Phone app loaded');
history.replaceState({ screen: 'w1' }, '');
showW1();
</script>
</body>
</html>
