<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fragrant Souq — Perfume Photo Extractor</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  form { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-top: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; margin-top: 14px; }
  input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  input[type="file"] { margin-top: 4px; }
  button { margin-top: 20px; background: #111; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:disabled { background: #999; cursor: not-allowed; }
  button.secondary { background: #fff; color: #111; border: 1px solid #111; }
  #status, #recordStatus { margin-top: 14px; font-size: 14px; color: #666; }
  table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 13px; }
  th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
  th { background: #f5f5f5; }
  td input[type="text"] { border: 1px solid transparent; background: transparent; padding: 4px; font-size: 13px; width: 100%; box-sizing: border-box; border-radius: 4px; }
  td input[type="text"]:hover { border-color: #ccc; }
  td input[type="text"]:focus { border-color: #111; background: #fff; outline: none; }
  td input[type="text"].edited { background: #fff8e1; }
  td.checkbox-cell { text-align: center; width: 30px; }
  tr.row-saved { background: #f0fdf4; }
  tr.row-saved td.checkbox-cell::after { content: "✓"; color: #1a7a1a; font-size: 11px; display: block; }
  .error { color: #b00020; margin-top: 14px; }
  .confidence-low { color: #b00020; }
  .confidence-medium { color: #a67c00; }
  .confidence-high { color: #1a7a1a; }
  .actions { margin-top: 16px; display: flex; gap: 10px; align-items: center; }
  .top-bar { position: relative; text-align: center; }
  .top-bar a.search-link { position: absolute; top: 4px; right: 0; font-size: 14px; color: #111; text-decoration: none; border: 1px solid #111; padding: 6px 14px; border-radius: 6px; white-space: nowrap; }
  .top-bar a.search-link:hover { background: #111; color: #fff; }
  .top-bar a.logout-link { position: absolute; top: 4px; left: 0; font-size: 13px; color: #666; text-decoration: none; }
  .top-bar a.logout-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="/logout" class="logout-link">Log out</a>
  <div>
    <h1>Perfume Photo Extractor</h1>
    <p class="sub">Upload a shelf photo and the shop name — items will be listed below. Fix anything wrong, then select which items to record.</p>
  </div>
  <a href="/search" class="search-link">🔍 Search</a>
</div>

<form id="uploadForm">
  <label for="shop_name">Shop name</label>
  <input type="text" id="shop_name" name="shop_name" list="shopNameOptions" placeholder="e.g. Al Haramain Dubai Mall" autocomplete="off" required>
  <datalist id="shopNameOptions"></datalist>

  <label for="photo">Photo</label>
  <input type="file" id="photo" name="photo" accept="image/*" required>

  <button type="submit" id="submitBtn">Extract items</button>
  <div id="status"></div>
</form>

<div id="results"></div>

<script>
const FIELDS = ["brand", "name", "size", "concentration", "gender", "condition"];
const FIELD_LABELS = { brand: "Brand", name: "Name", size: "Size", concentration: "Concentration", gender: "Gender", condition: "Condition" };

const form = document.getElementById("uploadForm");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const submitBtn = document.getElementById("submitBtn");

let currentShopName = "";
let currentImageUrl = null;   // filled in from /extract's response, sent back to /record
let originalItems = [];   // exactly what Claude returned, never mutated
let savedSnapshots = {};  // row index (string) -> the corrected values as of its last successful save; absent = never saved

// Populate the Shop name autocomplete list with every shop used before
(async function loadShopNames() {
  try {
    const res = await fetch("/api/shop-names");
    if (!res.ok) return; // fail quietly — typing still works without the list
    const data = await res.json();
    const datalist = document.getElementById("shopNameOptions");
    datalist.innerHTML = (data.shop_names || [])
      .map(name => `<option value="${escapeHtml(name)}"></option>`)
      .join("");
  } catch (err) {
    // Autocomplete is a convenience, not a requirement — say nothing if it fails
  }
})();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  resultsEl.innerHTML = "";
  statusEl.textContent = "Analyzing photo... this can take 10-20 seconds.";
  statusEl.className = "";
  submitBtn.disabled = true;

  currentShopName = document.getElementById("shop_name").value.trim();

  const formData = new FormData();
  formData.append("shop_name", currentShopName);
  formData.append("photo", document.getElementById("photo").files[0]);

  try {
    const res = await fetch("/extract", { method: "POST", body: formData });
    const data = await res.json();

    if (!res.ok) {
      statusEl.textContent = "";
      resultsEl.innerHTML = `<div class="error">Error: ${data.error || "Unknown error"}</div>`;
      submitBtn.disabled = false;
      return;
    }

    statusEl.textContent = `Found ${data.item_count} item(s) at "${data.shop_name}". Review and correct below, then select which to record.`;
    originalItems = data.items;
    currentImageUrl = data.image_url ?? null;
    savedSnapshots = {}; // fresh photo — nothing saved yet for this batch

    renderTable(data.items);
  } catch (err) {
    statusEl.textContent = "";
    resultsEl.innerHTML = `<div class="error">Request failed: ${err.message}</div>`;
  } finally {
    submitBtn.disabled = false;
  }
});

function renderTable(items) {
  if (items.length === 0) {
    resultsEl.innerHTML = "<p>No items detected in this photo.</p>";
    return;
  }

  let html = '<table id="itemsTable"><thead><tr><th></th>';
  FIELDS.forEach(f => html += `<th>${FIELD_LABELS[f]}</th>`);
  html += "<th>Confidence</th></tr></thead><tbody>";

  items.forEach((item, i) => {
    html += `<tr data-row="${i}"><td class="checkbox-cell"><input type="checkbox" class="row-select"></td>`;
    FIELDS.forEach(f => {
      const val = item[f] ?? "";
      html += `<td><input type="text" class="field-input" data-field="${f}" value="${escapeHtml(val)}"></td>`;
    });
    html += `<td class="confidence-${item.confidence ?? ''}">${item.confidence ?? "-"}</td></tr>`;
  });

  html += "</tbody></table>";
  html += `
    <div class="actions">
      <button id="saveBtn" type="button" disabled>Save selected items</button>
      <button id="selectAllBtn" type="button" class="secondary">Select all</button>
      <button id="deselectAllBtn" type="button" class="secondary">Deselect all</button>
    </div>
    <div id="recordStatus"></div>
  `;

  resultsEl.innerHTML = html;

  document.querySelectorAll(".field-input").forEach(input => {
    const originalValue = input.value;
    input.addEventListener("input", () => {
      input.classList.toggle("edited", input.value !== originalValue);
      refreshSaveButtonState();
    });
  });

  document.querySelectorAll(".row-select").forEach(cb => {
    cb.addEventListener("change", refreshSaveButtonState);
  });

  document.getElementById("selectAllBtn").addEventListener("click", () => {
    document.querySelectorAll(".row-select").forEach(cb => cb.checked = true);
    refreshSaveButtonState();
  });
  document.getElementById("deselectAllBtn").addEventListener("click", () => {
    document.querySelectorAll(".row-select").forEach(cb => cb.checked = false);
    refreshSaveButtonState();
  });
  document.getElementById("saveBtn").addEventListener("click", saveSelectedItems);
}

// Current field values for a row, as an object keyed by field name
function getRowCorrected(row) {
  const corrected = {};
  row.querySelectorAll(".field-input").forEach(input => {
    corrected[input.dataset.field] = input.value.trim() || null;
  });
  return corrected;
}

// A row needs (re-)saving if it's checked AND either never saved before,
// or its values have changed since the last time it was saved.
function rowNeedsSaving(row) {
  if (!row.querySelector(".row-select").checked) return false;
  const i = row.dataset.row;
  const saved = savedSnapshots[i];
  if (!saved) return true;
  return JSON.stringify(getRowCorrected(row)) !== JSON.stringify(saved);
}

function refreshSaveButtonState() {
  const saveBtn = document.getElementById("saveBtn");
  if (!saveBtn) return;
  const rows = document.querySelectorAll("#itemsTable tbody tr");
  const anyNeedsSaving = Array.from(rows).some(rowNeedsSaving);
  saveBtn.disabled = !anyNeedsSaving;
}

async function saveSelectedItems() {
  const recordStatusEl = document.getElementById("recordStatus");
  const saveBtn = document.getElementById("saveBtn");
  const rows = document.querySelectorAll("#itemsTable tbody tr");

  // Only rows that are checked AND (new or edited since their last save) get sent —
  // this is what avoids re-saving duplicates for rows that are still checked but
  // already saved unchanged.
  const rowsToSave = Array.from(rows).filter(rowNeedsSaving);

  if (rowsToSave.length === 0) {
    recordStatusEl.textContent = "Nothing new to save.";
    recordStatusEl.className = "";
    return;
  }

  const items = rowsToSave.map(row => {
    const i = parseInt(row.dataset.row, 10);
    return { original: originalItems[i], corrected: getRowCorrected(row), selected: true };
  });

  saveBtn.disabled = true;
  recordStatusEl.textContent = "Saving...";
  recordStatusEl.className = "";

  try {
    const res = await fetch("/record", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ shop_name: currentShopName, image_url: currentImageUrl, items }),
    });
    const data = await res.json();

    if (!res.ok) {
      recordStatusEl.innerHTML = `<div class="error">Error: ${data.error || "Unknown error"}</div>`;
      refreshSaveButtonState(); // re-enable if there's still something to (re)try
      return;
    }

    // Remember exactly what was saved for each of these rows, and mark them visually
    rowsToSave.forEach(row => {
      const i = row.dataset.row;
      savedSnapshots[i] = getRowCorrected(row);
      row.classList.add("row-saved");
    });

    recordStatusEl.textContent = `Saved ${data.items_saved} item(s) to the database. Logged ${data.corrections_logged} correction(s) for future accuracy. Select or edit more to save additional items.`;
    refreshSaveButtonState(); // disables again unless something else still needs saving
  } catch (err) {
    recordStatusEl.innerHTML = `<div class="error">Request failed: ${err.message}</div>`;
    refreshSaveButtonState();
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
</script>

</body>
</html>
