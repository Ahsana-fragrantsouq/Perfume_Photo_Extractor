<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in — Fragrant Souq Perfume Extractor</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 360px; margin: 100px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; text-align: center; }
  label { display: block; font-weight: 600; margin-bottom: 6px; margin-top: 14px; }
  input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
  button { margin-top: 20px; background: #111; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 14px; }
  .error { color: #b00020; margin-top: 14px; font-size: 14px; }
</style>
</head>
<body>

<h1>Fragrant Souq — Perfume Extractor</h1>
<form method="POST">
  <label for="username">Username</label>
  <input type="text" id="username" name="username" autofocus required>

  <label for="password">Password</label>
  <input type="password" id="password" name="password" required>

  <button type="submit">Log in</button>
</form>
{% if error %}<div class="error">{{ error }}</div>{% endif %}

</body>
</html>
