<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Saved data · FS Extractor</title>

  <!-- PWA -->
  <meta name="theme-color" content="#1c1a17">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --panel: #1c1a17; --card: #221f1b; --field: #2a2723; --line: #3d3934;
      --text: #f3efe8; --muted: #a39d93; --gold: #c9a45c; --gold-press: #b38f4a;
      --red: #e0806f; --green: #8fc79a; --amber: #d9b56b; --airtable: #2f7d4f;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--panel); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    [hidden] { display: none !important; }

    header { padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; flex-direction: column; gap: 10px; }
    .top { display: flex; align-items: center; justify-content: space-between; }
    .back { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600; padding: 6px 0; }
    .back svg { width: 22px; height: 22px; color: var(--muted); }
    .logout { color: var(--red); font-size: 14px; padding: 8px 4px; text-decoration: none; }


    input[type="text"], input[type="search"] {
      width: 100%; height: 44px; padding: 0 12px; background: var(--field); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; font-size: 16px;
    }
    .hint { font-size: 12px; color: var(--muted); }

    .list { flex: 1; overflow-y: auto; padding: 2px 16px 16px; -webkit-overflow-scrolling: touch; }
    .empty { color: var(--muted); text-align: center; padding: 48px 16px; line-height: 1.6; }

    .card { display: flex; gap: 12px; align-items: flex-start; padding: 12px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
    .card.picked { border-color: var(--gold); }
    .tick { width: 24px; height: 24px; flex-shrink: 0; accent-color: var(--gold); margin: 1px 0 0; }
    .body { flex: 1; min-width: 0; }
    .title { font-size: 15px; font-weight: 600; line-height: 1.35; }
    .sub { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .pname { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .when { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .sku-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .sku-row label { font-size: 12px; color: var(--muted); }
    .sku-row input { height: 38px; font-size: 15px; flex: 1; min-width: 0; }
    .sku-row input.edited { border-color: var(--gold); }
    .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .photo-link { color: var(--gold); font-size: 13px; text-decoration: underline; padding: 6px 0; }
    .airtable-btn { background: var(--airtable); color: #fff; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 8px; }
    .airtable-btn:disabled { background: var(--field); color: var(--muted); }
    .matched { font-size: 12px; color: var(--green); }

    footer {
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px;
    }
    .msg { font-size: 14px; line-height: 1.45; }
    .msg.error { color: var(--red); }
    .msg.ok { color: var(--green); }
    .foot-row { display: flex; gap: 10px; }
    .ghost { flex: 1; height: 44px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
    .ghost.danger { color: var(--red); border-color: #6b3a31; }
    .ghost:disabled, .primary:disabled { opacity: .45; }
    .primary { flex: 1; height: 44px; border-radius: 10px; background: var(--gold); color: #1c1a17; font-size: 14px; font-weight: 600; }
    .primary:active { background: var(--gold-press); }
  </style>
</head>
<body>

  <header>
    <div class="top">
      <button id="backBtn" class="back" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Saved data
      </button>
      <a class="logout" href="/logout?next=/m/" id="logoutLink">Log out</a>
    </div>

    <input id="filter" type="search" placeholder="Filter by shop, brand, name, SKU" autocomplete="off" aria-label="Filter">
    <div id="tabHint" class="hint"></div>
  </header>

  <main id="list" class="list"></main>

  <footer>
    <div id="msg" class="msg" role="status"></div>
    <div class="foot-row">
      <button id="deleteBtn" class="ghost danger" type="button" disabled>Delete selected</button>
    </div>
    <div class="foot-row" id="skuRow">
      <button id="updateSkusBtn" class="primary" type="button" disabled>Update SKUs</button>
    </div>
  </footer>

<!-- Data from the server (Flask fills this in). Kept separate from the code below
     so VS Code doesn't flag the Flask template tags as JavaScript errors. -->
<script id="saved-data" type="application/json">
{{ {"master_table": master_items} | tojson }}
</script>

<script>
/* =================================================================
   FS Extractor — phone Saved data (Master table only)
   Same Master data and same routes as /admin/data on the laptop.
   Recorded and Corrections are only shown on the laptop page.
     Delete selected  -> POST /admin/delete
     Update SKUs      -> POST /admin/update-sku
     Save to Airtable -> POST /admin/create-in-airtable
   Log tag: [data]
   ================================================================= */

// Saved data is placed by Flask in the <script id="saved-data"> block above.
const DATA = JSON.parse(document.getElementById('saved-data').textContent);


const $ = (id) => document.getElementById(id);
const log = (...a) => console.log('[data]', ...a);
const warn = (...a) => console.warn('[data]', ...a);

const tab = 'master_table';             // the only table shown on the phone
const picked = { master_table: new Set() };
const skuEdits = {};    // row id -> SKU typed but not yet saved with Update SKUs

log(`Loaded | master ${DATA.master_table.length} item(s)`);

/* ------------------------- Helpers ------------------------- */

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// "2026-09-08T06:42:08+00:00" -> "8 Sep, 10:42" in the phone's own time zone
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const join = (...parts) => parts.filter((p) => p !== null && p !== undefined && String(p).trim() !== '').map(esc).join(' · ');

function setMsg(text, type) {
  $('msg').textContent = text;
  $('msg').className = 'msg' + (type ? ' ' + type : '');
}

/* ------------------------- Filtering ------------------------- */

function visibleRows() {
  const q = $('filter').value.trim().toLowerCase();
  const rows = DATA[tab];
  if (!q) return rows;
  return rows.filter((r) => Object.values(r).some((v) => v !== null && String(v).toLowerCase().includes(q)));
}

/* ------------------------- Cards ------------------------- */

function masterCard(r) {
  const current = skuEdits[r.id] ?? (r.sku || '');
  const edited = r.id in skuEdits && skuEdits[r.id] !== (r.sku || '');
  return `
    <div class="card${picked.master_table.has(r.id) ? ' picked' : ''}" data-id="${r.id}">
      <input type="checkbox" class="tick" data-id="${r.id}" ${picked.master_table.has(r.id) ? 'checked' : ''} aria-label="Select item ${r.id}">
      <div class="body">
        <div class="title">${join(r.brand, r.name) || 'Unnamed item'}</div>
        <div class="sub">${join(r.shop_name, r.size, r.concentration, r.gender, r.condition)}</div>
        ${r.product_name ? `<div class="pname">${esc(r.product_name)}</div>` : ''}
        <div class="sku-row">
          <label for="sku-${r.id}">SKU</label>
          <input type="text" id="sku-${r.id}" class="sku${edited ? ' edited' : ''}" data-id="${r.id}" value="${esc(current)}" autocomplete="off" autocapitalize="characters">
        </div>
        <div class="card-actions">
          ${r.image_url ? `<a class="photo-link" href="${esc(r.image_url)}" target="_blank" rel="noopener">View photo</a>` : '<span></span>'}
          ${r.sku ? '<span class="matched">SKU matched</span>'
                  : `<button type="button" class="airtable-btn" data-id="${r.id}">Save to Airtable</button>`}
        </div>
        <div class="when">${when(r.updated_at)}</div>
      </div>
    </div>`;
}

const CARD = { master_table: masterCard };

function render() {
  const rows = visibleRows();
  $('list').innerHTML = rows.length
    ? rows.map(CARD[tab]).join('')
    : `<div class="empty">${$('filter').value ? 'Nothing matches this filter.' : 'Nothing saved here yet.'}</div>`;

  const total = DATA.master_table.length;
  $('tabHint').textContent = `${total} saved item${total === 1 ? '' : 's'}${$('filter').value ? ` · ${rows.length} shown` : ''}`;
  refreshButtons();
}

function refreshButtons() {
  const n = picked[tab].size;
  $('deleteBtn').disabled = n === 0;
  $('deleteBtn').textContent = n ? `Delete selected (${n})` : 'Delete selected';
  const skuChanges = pendingSkuChanges().length;
  $('updateSkusBtn').disabled = skuChanges === 0;
  $('updateSkusBtn').textContent = skuChanges ? `Update SKUs (${skuChanges})` : 'Update SKUs';
}

function pendingSkuChanges() {
  return DATA.master_table
    .filter((r) => r.id in skuEdits && skuEdits[r.id] !== (r.sku || ''))
    .map((r) => ({ id: r.id, sku: skuEdits[r.id].trim() }));
}

/* ------------------------- Filter, selecting ------------------------- */

let filterTimer;
$('filter').addEventListener('input', () => {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(() => { log(`Filter "${$('filter').value}" -> ${visibleRows().length} shown`); render(); }, 200);
});

$('list').addEventListener('change', (e) => {
  if (!e.target.classList.contains('tick')) return;
  const id = +e.target.dataset.id;
  e.target.checked ? picked[tab].add(id) : picked[tab].delete(id);
  e.target.closest('.card').classList.toggle('picked', e.target.checked);
  log(`${tab} #${id} ${e.target.checked ? 'selected' : 'unselected'}`);
  refreshButtons();
});

/* ------------------------- SKU typing ------------------------- */

$('list').addEventListener('input', (e) => {
  if (!e.target.classList.contains('sku')) return;
  const id = +e.target.dataset.id;
  const row = DATA.master_table.find((r) => r.id === id);
  skuEdits[id] = e.target.value;
  e.target.classList.toggle('edited', e.target.value !== (row.sku || ''));
  refreshButtons();
});
$('list').addEventListener('focusout', (e) => {
  if (e.target.classList && e.target.classList.contains('sku')) {
    const id = +e.target.dataset.id;
    const row = DATA.master_table.find((r) => r.id === id);
    if (e.target.value !== (row.sku || '')) log(`SKU typed for #${id}: "${row.sku || ''}" -> "${e.target.value}" (not saved yet)`);
  }
});

/* ------------------------- Delete selected ------------------------- */

$('deleteBtn').addEventListener('click', async () => {
  const ids = [...picked[tab]];
  if (!ids.length) return;
  if (!confirm(`Delete ${ids.length} saved item(s)? This cannot be undone.`)) { log('Delete cancelled'); return; }

  log(`Deleting ${ids.length} row(s) from ${tab}:`, ids);
  $('deleteBtn').disabled = true;
  setMsg('Deleting…');
  try {
    const res = await fetch('/admin/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ table: tab, ids }),
    });
    if (res.status === 401) return toLogin();
    const data = await res.json();
    if (!res.ok) { warn('Delete failed:', data); setMsg(data.error || `Delete failed (status ${res.status}).`, 'error'); return; }

    const gone = new Set(ids);
    DATA[tab] = DATA[tab].filter((r) => !gone.has(r.id));
    picked[tab].clear();
    ids.forEach((id) => delete skuEdits[id]);
    log(`Deleted ${data.deleted} row(s) from ${tab}`);
    setMsg(`Deleted ${data.deleted} item(s).`, 'ok');
    render();
  } catch (err) {
    warn('Delete error:', err.message);
    setMsg('Connection lost while deleting. Check your internet and try again.', 'error');
  } finally { refreshButtons(); }
});

/* ------------------------- Update SKUs ------------------------- */

$('updateSkusBtn').addEventListener('click', async () => {
  const updates = pendingSkuChanges();
  if (!updates.length) return;
  log(`Updating ${updates.length} SKU(s):`, updates);
  $('updateSkusBtn').disabled = true;
  setMsg(`Saving ${updates.length} SKU change(s)…`);
  try {
    const res = await fetch('/admin/update-sku', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ updates }),
    });
    if (res.status === 401) return toLogin();
    const data = await res.json();
    if (!res.ok) { warn('Update SKUs failed:', data); setMsg(data.error || `Update failed (status ${res.status}).`, 'error'); return; }

    updates.forEach((u) => {
      const row = DATA.master_table.find((r) => r.id === u.id);
      if (row) row.sku = u.sku || null;
      delete skuEdits[u.id];
    });
    log(`Updated ${data.updated} SKU(s)`);
    setMsg(`Updated ${data.updated} SKU(s).`, 'ok');
    render();
  } catch (err) {
    warn('Update SKUs error:', err.message);
    setMsg('Connection lost while saving SKUs. Check your internet and try again.', 'error');
  } finally { refreshButtons(); }
});

/* ------------------------- Save to Airtable ------------------------- */

$('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('.airtable-btn');
  if (!btn) return;
  const id = +btn.dataset.id;
  const row = DATA.master_table.find((r) => r.id === id);
  const body = {
    id, brand: row.brand || '', name: row.name || '', size: row.size || '',
    concentration: row.concentration || '', gender: row.gender || '',
  };
  log(`Save to Airtable #${id}:`, body);
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const res = await fetch('/admin/create-in-airtable', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (res.status === 401) return toLogin();
    const data = await res.json();

    if (!res.ok) {
      if (data.error === 'no_brand' || data.error === 'no_prefix') {
        warn(`Airtable #${id}: ${data.error} - ${data.message}`);
        btn.textContent = data.error === 'no_brand' ? 'Brand not in Airtable' : 'No SKU prefix set';
        setMsg(data.message || '', 'error');
        return;   // stays disabled, same as the laptop
      }
      warn(`Airtable #${id} failed:`, data);
      setMsg(data.error || `Airtable save failed (status ${res.status}).`, 'error');
      btn.disabled = false;
      btn.textContent = 'Save to Airtable';
      return;
    }

    row.sku = data.sku;
    delete skuEdits[id];
    log(`Airtable #${id} created | SKU ${data.sku}`);
    setMsg(`Created in Airtable with SKU ${data.sku}.`, 'ok');
    render();
  } catch (err) {
    warn(`Airtable #${id} error:`, err.message);
    setMsg('Connection lost while saving to Airtable. Try again.', 'error');
    btn.disabled = false;
    btn.textContent = 'Save to Airtable';
  }
});

/* ------------------------- Navigation ------------------------- */

function unsavedSkuWarning() {
  const n = pendingSkuChanges().length;
  return n ? `${n} SKU change(s) are not saved yet. Leave without saving?` : null;
}

$('backBtn').addEventListener('click', () => {
  const w = unsavedSkuWarning();
  if (w && !confirm(w)) return;
  log('Back to camera');
  if (document.referrer.includes('/m/') && !document.referrer.includes('/m/data')) history.back();
  else location.href = '/m/';
});

$('logoutLink').addEventListener('click', (e) => {
  if (!confirm('Log out? You will need your username and password to open the app again.')) { e.preventDefault(); return; }
  log('Logging out');
});

window.addEventListener('beforeunload', (e) => {
  if (pendingSkuChanges().length) { e.preventDefault(); e.returnValue = ''; }
});

function toLogin() {
  warn('Not logged in -> login page');
  location.href = '/login?next=/m/data';
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch((err) => warn('Service worker registration failed:', err));
}

render();
</script>
</body>
</html>
