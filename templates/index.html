<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fragrant Souq — Perfume Photo Extractor</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 1200px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  form { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-top: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; margin-top: 14px; }
  input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  input[type="file"] { margin-top: 4px; }
  button { margin-top: 20px; background: #111; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:disabled { background: #999; cursor: not-allowed; }
  button.secondary { background: #fff; color: #111; border: 1px solid #111; }
  #status, #recordStatus { margin-top: 14px; font-size: 14px; color: #666; }
  table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 13px; table-layout: fixed; }
  th, td { border: 1px solid #ddd; padding: 6px; text-align: left; overflow: hidden; text-overflow: ellipsis; }
  th { background: #f5f5f5; }
  .itemsTable th:nth-child(1), .itemsTable td:nth-child(1) { width: 28px; }   /* checkbox */
  .itemsTable th:nth-child(2), .itemsTable td:nth-child(2) { width: 15%; }    /* Brand */
  .itemsTable th:nth-child(3), .itemsTable td:nth-child(3) { width: 24%; }    /* Name — the one that was getting cut off */
  .itemsTable th:nth-child(4), .itemsTable td:nth-child(4) { width: 9%; }     /* Size */
  .itemsTable th:nth-child(5), .itemsTable td:nth-child(5) { width: 14%; }    /* Concentration */
  .itemsTable th:nth-child(6), .itemsTable td:nth-child(6) { width: 9%; }     /* Gender */
  .itemsTable th:nth-child(7), .itemsTable td:nth-child(7) { width: 9%; }     /* Condition */
  .itemsTable th:nth-child(8), .itemsTable td:nth-child(8) { width: 8%; }     /* Confidence */
  td input[type="text"] { border: 1px solid transparent; background: transparent; padding: 4px; font-size: 13px; width: 100%; box-sizing: border-box; border-radius: 4px; }
  td input[type="text"]:hover { border-color: #ccc; }
  td input[type="text"]:focus { border-color: #111; background: #fff; outline: none; }
  td input[type="text"].edited { background: #fff8e1; }
  td.checkbox-cell { text-align: center; width: 30px; }
  tr.row-saved { background: #f0fdf4; }
  tr.row-saved td.checkbox-cell::after { content: "✓"; color: #1a7a1a; font-size: 11px; display: block; }
  .error { color: #b00020; margin-top: 14px; }
  .batch { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 24px; }
  .batch-head { display: flex; gap: 14px; align-items: center; }
  .batch-head img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; cursor: zoom-in; }
  .batch-head h3 { margin: 0 0 4px 0; font-size: 15px; }
  .batch-status { font-size: 14px; color: #666; }
  #fileList { margin-top: 8px; font-size: 13px; color: #666; }
  .confidence-low { color: #b00020; }
  .confidence-medium { color: #a67c00; }
  .confidence-high { color: #1a7a1a; }
  .actions { margin-top: 16px; display: flex; gap: 10px; align-items: center; }
  .top-bar { position: relative; text-align: center; }
  .top-bar .top-right-links { position: absolute; top: 4px; right: 0; display: flex; gap: 8px; }
  .top-bar .top-right-links a { font-size: 14px; color: #111; text-decoration: none; border: 1px solid #111; padding: 6px 14px; border-radius: 6px; white-space: nowrap; }
  .top-bar .top-right-links a:hover { background: #111; color: #fff; }
  .top-bar a.logout-link { position: absolute; top: 4px; left: 0; font-size: 13px; color: #666; text-decoration: none; }
  .top-bar a.logout-link:hover { text-decoration: underline; }
  #results { overflow-x: auto; }
  .batch-table-wrap { overflow-x: auto; }   /* wide results table scrolls sideways instead of squashing */

  /* Phones: the title and the 3 links can't share one row, so put Log out on the
     left and Search/Saved items on the right in the first row, title below. */
  @media (max-width: 700px) {
    body { margin: 16px auto; }
    .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    .top-bar a.logout-link, .top-bar .top-right-links { position: static; }
    .top-bar > div:nth-child(2) { order: 3; width: 100%; }
    .top-bar .top-right-links a { padding: 6px 10px; font-size: 13px; }
    .itemsTable { min-width: 760px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <a href="/logout" class="logout-link">Log out</a>
  <div>
    <h1>Perfume Photo Extractor</h1>
    <p class="sub">Upload a shelf photo and the shop name — items will be listed below. Fix anything wrong, then select which items to record.</p>
  </div>
  <div class="top-right-links">
    <a href="/search">🔍 Search</a>
    <a href="/admin/data">📋 Saved items</a>
   
  </div>
</div>

<form id="uploadForm">
  <label for="shop_name">Shop name</label>
  <input type="text" id="shop_name" name="shop_name" list="shopNameOptions" placeholder="e.g. Al Haramain Dubai Mall" autocomplete="off" required>
  <datalist id="shopNameOptions"></datalist>

  <label for="photo">Photos</label>
  <input type="file" id="photo" name="photo" accept="image/*" multiple>

  <!-- Opens the phone's camera directly. The photo is added to the list of selected photos. -->
  <button type="button" id="cameraBtn" class="secondary" style="margin-top:10px;">📷 Take photo with camera</button>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
  <div id="fileList"></div>

  <button type="submit" id="submitBtn">Extract items</button>
  <div id="status"></div>
</form>

<div id="results"></div>
<datalist id="concentrationOptions"></datalist>
<datalist id="genderOptions"></datalist>
<datalist id="conditionOptions"></datalist>

<script>
const FIELDS = ["brand", "name", "size", "concentration", "gender", "condition"];
const FIELD_LABELS = { brand: "Brand", name: "Name", size: "Size", concentration: "Concentration", gender: "Gender", condition: "Condition" };
const AUTOCOMPLETE_FIELDS = ["concentration", "gender", "condition"];

const form = document.getElementById("uploadForm");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const submitBtn = document.getElementById("submitBtn");
const photoInput = document.getElementById("photo");
const cameraBtn = document.getElementById("cameraBtn");
const cameraInput = document.getElementById("cameraInput");
const fileListEl = document.getElementById("fileList");

let selectedFiles = [];   // every photo waiting to be extracted

// Shop name autocomplete
(async function loadShopNames() {
  try {
    const res = await fetch("/api/shop-names");
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById("shopNameOptions").innerHTML = (data.shop_names || [])
      .map(name => `<option value="${escapeHtml(name)}"></option>`).join("");
  } catch (err) { /* autocomplete is optional */ }
})();

// Concentration / Gender / Condition autocomplete lists
(async () => {
  try {
    const res = await fetch("/api/field-options");
    if (!res.ok) return;
    const options = await res.json();
    AUTOCOMPLETE_FIELDS.forEach(f => {
      document.getElementById(`${f}Options`).innerHTML = (options[f] || [])
        .map(val => `<option value="${escapeHtml(val)}"></option>`).join("");
    });
  } catch (err) { /* optional */ }
})();

function refreshFileList() {
  fileListEl.textContent = selectedFiles.length
    ? `${selectedFiles.length} photo(s) selected: ` + selectedFiles.map(f => f.name).join(", ")
    : "";
  console.log(`[upload] ${selectedFiles.length} photo(s) selected`);
}

// "Choose files" replaces the selection; the camera button adds one more photo
photoInput.addEventListener("change", () => {
  selectedFiles = Array.from(photoInput.files);
  refreshFileList();
});
cameraBtn.addEventListener("click", () => cameraInput.click());
cameraInput.addEventListener("change", () => {
  const file = cameraInput.files[0];
  if (!file) return;
  selectedFiles.push(file);
  refreshFileList();
  statusEl.textContent = "Photo added — tap Extract items.";
  cameraInput.value = "";
});

// Extract: each photo is sent on its own and gets its own result section
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (selectedFiles.length === 0) {
    statusEl.textContent = "Please choose at least one photo.";
    return;
  }
  const shopName = document.getElementById("shop_name").value.trim();
  const files = selectedFiles.slice();
  resultsEl.innerHTML = "";
  submitBtn.disabled = true;
  console.log(`[extract] Starting ${files.length} photo(s) for shop "${shopName}"`);

  // Create all sections first so you can see the whole queue
  const batches = files.map((file, i) => createBatchSection(file, i, files.length, shopName));

  for (let i = 0; i < files.length; i++) {
    statusEl.textContent = `Analyzing photo ${i + 1} of ${files.length}... this can take 10-20 seconds each.`;
    await extractBatch(batches[i], files[i]);
  }
  statusEl.textContent = `Done — ${files.length} photo(s) processed. Review each photo's items below.`;
  submitBtn.disabled = false;
});

function createBatchSection(file, index, total, shopName) {
  const el = document.createElement("div");
  el.className = "batch";
  const thumbUrl = URL.createObjectURL(file);
  el.innerHTML = `
    <div class="batch-head">
      <a href="${thumbUrl}" target="_blank"><img src="${thumbUrl}" alt=""></a>
      <div>
        <h3>Photo ${index + 1} of ${total}: ${escapeHtml(file.name)}</h3>
        <div class="batch-status">Waiting...</div>
      </div>
    </div>
    <div class="batch-body"></div>`;
  resultsEl.appendChild(el);
  return { el, shopName, imageUrl: null, originalItems: [], savedSnapshots: {} };
}

async function extractBatch(batch, file) {
  const statusDiv = batch.el.querySelector(".batch-status");
  const body = batch.el.querySelector(".batch-body");
  statusDiv.textContent = "Analyzing photo...";

  const formData = new FormData();
  formData.append("shop_name", batch.shopName);
  formData.append("photo", file);

  try {
    const res = await fetch("/extract", { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok) {
      statusDiv.textContent = "";
      body.innerHTML = `<div class="error">Error: ${escapeHtml(data.error || "Unknown error")}</div>`;
      console.log(`[extract] "${file.name}" failed:`, data.error);
      return;
    }
    console.log(`[extract] "${file.name}": ${data.item_count} item(s)`);
    statusDiv.textContent = `Found ${data.item_count} item(s) at "${data.shop_name}". Review and correct below, then select which to record.`;
    batch.originalItems = data.items;
    batch.imageUrl = data.image_url ?? null;
    renderTable(batch);
  } catch (err) {
    statusDiv.textContent = "";
    body.innerHTML = `<div class="error">Request failed: ${escapeHtml(err.message)}</div>`;
  }
}

function renderTable(batch) {
  const body = batch.el.querySelector(".batch-body");
  const items = batch.originalItems;
  if (items.length === 0) {
    body.innerHTML = "<p>No items detected in this photo.</p>";
    return;
  }

  let html = '<div class="batch-table-wrap"><table class="itemsTable"><thead><tr><th></th>';
  FIELDS.forEach(f => html += `<th>${FIELD_LABELS[f]}</th>`);
  html += "<th>Confidence</th></tr></thead><tbody>";

  items.forEach((item, i) => {
    html += `<tr data-row="${i}"><td class="checkbox-cell"><input type="checkbox" class="row-select"></td>`;
    FIELDS.forEach(f => {
      const val = item[f] ?? "";
      const listAttr = AUTOCOMPLETE_FIELDS.includes(f) ? ` list="${f}Options"` : "";
      html += `<td><input type="text" class="field-input" data-field="${f}" value="${escapeHtml(val)}" title="${escapeHtml(val)}"${listAttr}></td>`;
    });
    html += `<td class="confidence-${item.confidence ?? ''}">${item.confidence ?? "-"}</td></tr>`;
  });

  html += "</tbody></table></div>";
  html += `
    <div class="actions">
      <button class="saveBtn" type="button" disabled>Save selected items</button>
      <button class="selectAllBtn" type="button" class="secondary">Select all</button>
      <button class="deselectAllBtn" type="button" class="secondary">Deselect all</button>
    </div>
    <div class="recordStatus" style="margin-top:14px;font-size:14px;color:#666;"></div>`;
  body.innerHTML = html;
  body.querySelectorAll(".selectAllBtn, .deselectAllBtn").forEach(b => b.classList.add("secondary"));

  const refresh = () => refreshSaveButtonState(batch);

  body.querySelectorAll(".field-input").forEach(input => {
    const originalValue = input.value;
    input.addEventListener("input", () => {
      input.classList.toggle("edited", input.value !== originalValue);
      input.title = input.value;
      refresh();
    });
  });
  body.querySelectorAll(".row-select").forEach(cb => cb.addEventListener("change", refresh));
  body.querySelector(".selectAllBtn").addEventListener("click", () => {
    body.querySelectorAll(".row-select").forEach(cb => cb.checked = true); refresh();
  });
  body.querySelector(".deselectAllBtn").addEventListener("click", () => {
    body.querySelectorAll(".row-select").forEach(cb => cb.checked = false); refresh();
  });
  body.querySelector(".saveBtn").addEventListener("click", () => saveSelectedItems(batch));
}

function getRowCorrected(row) {
  const corrected = {};
  row.querySelectorAll(".field-input").forEach(input => {
    corrected[input.dataset.field] = input.value.trim() || null;
  });
  return corrected;
}

// Checked AND (never saved, or edited since last save)
function rowNeedsSaving(batch, row) {
  if (!row.querySelector(".row-select").checked) return false;
  const saved = batch.savedSnapshots[row.dataset.row];
  if (!saved) return true;
  return JSON.stringify(getRowCorrected(row)) !== JSON.stringify(saved);
}

function refreshSaveButtonState(batch) {
  const saveBtn = batch.el.querySelector(".saveBtn");
  if (!saveBtn) return;
  const rows = batch.el.querySelectorAll(".itemsTable tbody tr");
  saveBtn.disabled = !Array.from(rows).some(r => rowNeedsSaving(batch, r));
}

async function saveSelectedItems(batch) {
  const recordStatusEl = batch.el.querySelector(".recordStatus");
  const saveBtn = batch.el.querySelector(".saveBtn");
  const rows = batch.el.querySelectorAll(".itemsTable tbody tr");
  const rowsToSave = Array.from(rows).filter(r => rowNeedsSaving(batch, r));

  if (rowsToSave.length === 0) {
    recordStatusEl.textContent = "Nothing new to save.";
    return;
  }

  const items = rowsToSave.map(row => {
    const i = parseInt(row.dataset.row, 10);
    return { original: batch.originalItems[i], corrected: getRowCorrected(row), selected: true };
  });

  saveBtn.disabled = true;
  recordStatusEl.textContent = "Saving...";
  console.log(`[save] Saving ${items.length} item(s) from one photo | image: ${batch.imageUrl}`);

  try {
    const res = await fetch("/record", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ shop_name: batch.shopName, image_url: batch.imageUrl, items }),
    });
    const data = await res.json();

    if (!res.ok) {
      recordStatusEl.innerHTML = `<div class="error">Error: ${escapeHtml(data.error || "Unknown error")}</div>`;
      refreshSaveButtonState(batch);
      return;
    }

    rowsToSave.forEach(row => {
      batch.savedSnapshots[row.dataset.row] = getRowCorrected(row);
      row.classList.add("row-saved");
    });
    recordStatusEl.textContent = `Saved ${data.items_saved} item(s) to the database. Logged ${data.corrections_logged} correction(s) for future accuracy. Select or edit more to save additional items.`;
    refreshSaveButtonState(batch);
  } catch (err) {
    recordStatusEl.innerHTML = `<div class="error">Request failed: ${escapeHtml(err.message)}</div>`;
    refreshSaveButtonState(batch);
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
</script>

</body>
</html>
